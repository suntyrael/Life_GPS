<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pwrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="aonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="540" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">Life_GPS 系统硬件双域架构与互联拓扑图</text>
  <text x="540" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">常通超低功耗域 (Always-On Domain &lt; 15µA) 与 受控突发高能域 (Switched GNSS Domain ~48mA) 物理隔离对比设计</text>

  <!-- 1. Top Power Management Section -->
  <rect x="40" y="90" width="1000" height="90" rx="10" fill="url(#pwrGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="60" y="115" fill="#f59e0b" font-size="14" font-weight="700">⚡ 基础电源管理层 (Battery &amp; Regulation)</text>
  
  <!-- USB-C Block -->
  <rect x="60" y="130" width="150" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="135" y="154" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Type-C 5V 输入</text>
  
  <line x1="210" y1="149" x2="250" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- TP4056 Block -->
  <rect x="250" y="130" width="150" height="38" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="325" y="148" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">TP4056 充电芯片</text>
  <text x="325" y="161" text-anchor="middle" fill="#94a3b8" font-size="10">过充/过放硬件保护</text>
  
  <line x1="400" y1="149" x2="440" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Battery Block -->
  <rect x="440" y="130" width="200" height="38" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" fill="#fef08a" font-size="12" font-weight="700">1000~1200mAh 锂电池</text>
  <text x="540" y="161" text-anchor="middle" fill="#cbd5e1" font-size="10">VBAT: 3.7V ~ 4.2V</text>
  
  <line x1="640" y1="149" x2="710" y2="149" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- TPS7A02 LDO Block -->
  <rect x="710" y="125" width="310" height="46" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="865" y="145" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">TPS7A02 超低静态 LDO (Iq = 25nA)</text>
  <text x="865" y="161" text-anchor="middle" fill="#94a3b8" font-size="10">输出系统常通主电源: VDD_3V3 (最高 200mA)</text>


  <!-- 2. Dual-Domain Contrast Containers -->

  <!-- LEFT: Always-On Low Power Domain -->
  <rect x="40" y="200" width="560" height="500" rx="10" fill="url(#aonGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="55" y="215" width="290" height="24" rx="4" fill="#065f46"/>
  <text x="200" y="232" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">【常通超低功耗域】 静态待机 &lt; 15 µA</text>

  <!-- nRF52840 MCU Main Card -->
  <rect x="60" y="255" width="520" height="200" rx="8" fill="url(#mcuGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="80" y="280" fill="#f3e8ff" font-size="16" font-weight="700">主控芯片: Nordic nRF52840 (QFN48 封装)</text>
  <text x="80" y="300" fill="#d8b4fe" font-size="11">ARM Cortex-M4F @ 64MHz | 1MB Flash | 256KB RAM | BLE 5.4 / 2Mbps</text>

  <!-- MCU Sub blocks -->
  <rect x="80" y="315" width="140" height="40" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="150" y="333" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">32MHz / 32.768kHz</text>
  <text x="150" y="347" text-anchor="middle" fill="#818cf8" font-size="9">双晶振时钟源</text>

  <rect x="235" y="315" width="150" height="40" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="310" y="333" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">片内 DC-DC 转换器</text>
  <text x="310" y="347" text-anchor="middle" fill="#818cf8" font-size="9">外挂 10µH+1µF 储能滤波</text>

  <rect x="400" y="315" width="160" height="40" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="480" y="333" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Type-C 原生 USB</text>
  <text x="480" y="347" text-anchor="middle" fill="#818cf8" font-size="9">CDC 串口 / MSC 虚拟 U 盘</text>

  <!-- Two Buttons Interaction in MCU -->
  <rect x="80" y="370" width="235" height="70" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.2"/>
  <text x="197" y="390" text-anchor="middle" fill="#fbcfe8" font-size="11" font-weight="700">🔘 按键 1 (P0.19): 配对 &amp; POI 打点</text>
  <text x="197" y="408" text-anchor="middle" fill="#f472b6" font-size="10">短按: 即刻抓取坐标/环境快照打点</text>
  <text x="197" y="424" text-anchor="middle" fill="#94a3b8" font-size="10">长按 3s: 启动 BLE 快速配对/离线同步</text>

  <rect x="325" y="370" width="235" height="70" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.2"/>
  <text x="442" y="390" text-anchor="middle" fill="#fbcfe8" font-size="11" font-weight="700">🔘 按键 2 (P0.23): 高精度记录切换</text>
  <text x="442" y="408" text-anchor="middle" fill="#f472b6" font-size="10">长按 2s: 切换超低功耗/连续高精轨迹</text>
  <text x="442" y="424" text-anchor="middle" fill="#94a3b8" font-size="10">短按: 电量与搜星状态灯语回显</text>

  <!-- Flash & IMU under MCU -->
  <!-- W25Q128JV Flash -->
  <rect x="60" y="475" width="230" height="95" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="175" y="498" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">W25Q128JV (16MB NOR Flash)</text>
  <text x="175" y="518" text-anchor="middle" fill="#94a3b8" font-size="10">总线: 高速 SPI (32MHz) | 休眠: 1µA</text>
  <text x="175" y="536" text-anchor="middle" fill="#38bdf8" font-size="10">紧凑型二进制存储格式 (32字节/条)</text>
  <text x="175" y="552" text-anchor="middle" fill="#94a3b8" font-size="9">海量黑匣子容量: 450,000+ 离线记录点</text>

  <!-- LSM6DSV16X IMU -->
  <rect x="310" y="475" width="270" height="95" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="445" y="498" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">LSM6DSV16X (ST 6轴旗舰 IMU)</text>
  <text x="445" y="518" text-anchor="middle" fill="#94a3b8" font-size="10">三核引擎: MLC 机器学习 + FSM 状态机</text>
  <text x="445" y="536" text-anchor="middle" fill="#10b981" font-size="10">SFLP 低功耗姿态四元数融合 (仅 15µA!)</text>
  <text x="445" y="552" text-anchor="middle" fill="#cbd5e1" font-size="9">PDR 行人航位推算接管 | Qvar 触摸检测</text>

  <!-- Sensor Hub (LIS2MDL + BMP388) -->
  <rect x="60" y="590" width="520" height="90" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="80" y="612" fill="#6ee7b7" font-size="12" font-weight="700">LSM6DSV16X 传感器集线器 (Sensor Hub Mode 2 独立 I2C Master)</text>
  
  <rect x="80" y="625" width="230" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="195" y="643" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">LIS2MDL 三轴磁力计</text>
  <text x="195" y="657" text-anchor="middle" fill="#94a3b8" font-size="9">地磁绝对航向参考 (消除陀螺仪偏航漂移)</text>

  <rect x="330" y="625" width="230" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="445" y="643" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">BMP388 高精度气压计</text>
  <text x="445" y="657" text-anchor="middle" fill="#94a3b8" font-size="9">相对高度精度 ±0.5m (爬坡/楼层识别)</text>


  <!-- RIGHT: Switched GNSS High-Power Domain -->
  <rect x="630" y="200" width="410" height="500" rx="10" fill="url(#swGrad)" stroke="#3b82f6" stroke-width="1.8" filter="url(#cardShadow)"/>
  <rect x="645" y="215" width="310" height="24" rx="4" fill="#1e3a8a"/>
  <text x="800" y="232" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">【受控突发高能域】 瞬态工作电流 ~48 mA</text>

  <!-- Load Switch TPS22918 -->
  <rect x="650" y="255" width="370" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="835" y="278" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">TPS22918 硬件负载电源开关</text>
  <text x="835" y="296" text-anchor="middle" fill="#e2e8f0" font-size="11">受控控制信号: P0.04 (GNSS_PWR_EN)</text>
  <text x="835" y="314" text-anchor="middle" fill="#ef4444" font-size="10">静止休眠彻底断开 VCC 供电 (切断漏电 &lt; 100nA)</text>

  <!-- ATGM336H-F8N76 GNSS Module Card -->
  <rect x="650" y="350" width="370" height="210" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="670" y="375" fill="#93c5fd" font-size="15" font-weight="700">中科微 ATGM336H-F8N76</text>
  <text x="670" y="395" fill="#f8fafc" font-size="11" font-weight="600">基于旗舰 AT9880 SoC | 176 通道 | 双频 L1+L5</text>
  
  <rect x="670" y="410" width="330" height="24" rx="3" fill="#1e293b"/>
  <text x="680" y="426" fill="#38bdf8" font-size="10">全系统星座: BDS-2/3 + GPS + GLO + GAL + QZSS</text>

  <rect x="670" y="440" width="330" height="24" rx="3" fill="#1e293b"/>
  <text x="680" y="456" fill="#34d399" font-size="10">极致跟踪灵敏度: -167 dBm | 水平精度 &lt; 1.0m (CEP50)</text>

  <rect x="670" y="470" width="330" height="24" rx="3" fill="#1e293b"/>
  <text x="680" y="486" fill="#fbcfe8" font-size="10">默认波特率: 115200 bps | 最大定位更新率: 20 Hz</text>

  <rect x="670" y="500" width="330" height="48" rx="3" fill="#1e293b"/>
  <text x="680" y="518" fill="#fde047" font-size="10">VBAT 常通 (15µA): SRAM与RTC星历长效保存</text>
  <text x="680" y="536" fill="#fde047" font-size="10">热启动首捕 TTFF &lt; 1s (开机即锁星定位)</text>

  <!-- RF Front-End LNA + SAW -->
  <rect x="650" y="580" width="370" height="100" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <text x="835" y="604" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">微型陶瓷贴片天线与射频匹配前端</text>
  <text x="835" y="624" text-anchor="middle" fill="#cbd5e1" font-size="10">外置 MAX2659 LNA 低噪放 (增益 20.5dB, NF 0.8dB)</text>
  <text x="835" y="642" text-anchor="middle" fill="#94a3b8" font-size="10">双频窄带 SAW 滤波器 (压制 BLE 2.4GHz 强射频互调干扰)</text>
  <text x="835" y="660" text-anchor="middle" fill="#38bdf8" font-size="10">50Ω 阻抗控制共面波导走线 ──▶ 15x15mm 无源陶瓷天线</text>

  <!-- Control & Data Links between domains -->
  <!-- Power Enable line -->
  <path d="M 580 290 L 650 290" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="615" y="282" text-anchor="middle" fill="#f87171" font-size="9" font-weight="600">PWR_EN</text>

  <!-- UART Data line -->
  <path d="M 650 410 L 580 410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="615" y="402" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">UART 115.2k</text>

  <!-- 1PPS Sync line -->
  <path d="M 650 450 L 580 450" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowAmber)"/>
  <text x="615" y="444" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">1PPS</text>

</svg>
