name: app

on:
  push:
    paths:
      - "App/**"
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "versions.yaml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "App/**"
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "versions.yaml"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('App/**/*.gradle*', 'App/gradle/libs.versions.toml', 'App/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Pure JVM core tests
        run: ./gradlew :core:protocol:test :core:model:test :core:data:test --stacktrace

      - name: Build, unit test, lint (dev & prod) + prodRelease R8 check
        run: >
          ./gradlew
          :app:assembleDevDebug :app:testDevDebugUnitTest :app:lintDevDebug
          :app:assembleProdDebug :app:testProdDebugUnitTest :app:lintProdDebug
          :app:assembleProdRelease
          --stacktrace

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: App/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Upload prod debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-debug
          path: App/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error

      - name: Upload prod release APK (R8 hardened, unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-unsigned
          path: App/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
