name: protocol

on:
  push:
    paths:
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "Firmware/include/generated/**"
      - "Firmware/tests/lifegps.protogen/src/generated_vectors.h"
      - "App/core/protocol/src/main/kotlin/com/lifegps/core/protocol/GeneratedProtocol.kt"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "Firmware/include/generated/**"
      - "Firmware/tests/lifegps.protogen/src/generated_vectors.h"
      - "App/core/protocol/src/main/kotlin/com/lifegps/core/protocol/GeneratedProtocol.kt"
      - ".github/workflows/protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/protocol-gen/requirements.txt
      - name: Validate protocol YAML
        run: python tools/protocol-gen/validate.py
      - name: Check generated C header
        run: python tools/protocol-gen/gen_c.py --check
      - name: Check generated Kotlin constants
        run: python tools/protocol-gen/gen_kt.py --check
      - name: Check Golden Vectors and manifest
        run: python tools/protocol-gen/gen_vectors.py --check
