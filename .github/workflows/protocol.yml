name: protocol

on:
  push:
    paths:
      - "protocol/**"
      - "tools/protocol-gen/**"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "tools/protocol-gen/**"
      - ".github/workflows/protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r tools/protocol-gen/requirements.txt
      - name: Validate protocol YAML
        run: python tools/protocol-gen/validate.py
