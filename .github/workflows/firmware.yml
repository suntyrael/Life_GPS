name: firmware

on:
  push:
    paths:
      - "Firmware/**"
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "versions.yaml"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "Firmware/**"
      - "protocol/**"
      - "tools/protocol-gen/**"
      - "versions.yaml"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

# The NCS toolchain image exports its environment through BASH_ENV, which only a
# bash shell sources. GitHub's default `sh -e` would not see cmake/ninja/west.
defaults:
  run:
    shell: bash

env:
  # Must stay equal to versions.yaml (revision / sdk) - both are part of the
  # frozen toolchain baseline, see versions.yaml header comment.
  NCS_REVISION: v3.4.2
  # The image ships the toolchain under /opt/ncs/toolchains/<id>; never touch that.
  NCS_WORKSPACE: /opt/ncs-workspace

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol tooling
        run: python -m pip install -r tools/protocol-gen/requirements.txt
      - name: Validate protocol YAML
        run: python tools/protocol-gen/validate.py
      - name: Generated C header drift check
        run: python tools/protocol-gen/gen_c.py --check

  build:
    runs-on: ubuntu-latest
    # Official NCS v3.4.2 toolchain image: gcc, cmake, ninja, west, dtc and the
    # NCS host tools. BASH_ENV=/opt/non-interactive-setup.sh injects the toolchain
    # environment into every non-interactive step.
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.2
      options: --user root
    needs: contract
    steps:
      - name: Toolchain self-report
        run: |
          set -eux
          echo "PATH=${PATH}"
          command -v west cmake ninja python3
          arm-zephyr-eabi-gcc --version | head -1
          python3 --version
          cmake --version | head -1
          ninja --version
          west --version

      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Explicit restore/save pair: the workspace must survive a failed build so a
      # rerun does not download NCS again (that was 4 minutes per attempt).
      - name: Restore NCS workspace
        id: ncs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NCS_WORKSPACE }}
          # Keyed on the NCS revision only: the CI workspace is created by
          # `west init -m nrfconnect/sdk-nrf --mr <revision>`, so editing
          # Firmware/west.yml (a developer-side manifest) must not throw the
          # 1.5 GB workspace cache away.
          key: ncs-ws-${{ env.NCS_REVISION }}

      - name: Prepare NCS workspace
        run: |
          set -eux
          if [ ! -d "${NCS_WORKSPACE}/.west" ]; then
            rm -rf "${NCS_WORKSPACE}"
            west init -m https://github.com/nrfconnect/sdk-nrf --mr "${NCS_REVISION}" "${NCS_WORKSPACE}"
            cd "${NCS_WORKSPACE}"
            # Only the projects this application actually compiles against.
            # A project filter is the supported way to trim imported projects
            # (cmsis / hal_nordic / picolibc arrive through the sdk-zephyr manifest).
            west config manifest.project-filter -- \
              "+nrf +zephyr +nrfxlib +cmsis +hal_nordic +picolibc +littlefs +mbedtls +mcuboot +segger"
            west update --narrow
          fi
          cd "${NCS_WORKSPACE}"
          west list -f '{name}: {revision}' | sort | head -20
          cat zephyr/VERSION

      - name: Save NCS workspace
        if: always() && steps.ncs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NCS_WORKSPACE }}
          # Keyed on the NCS revision only: the CI workspace is created by
          # `west init -m nrfconnect/sdk-nrf --mr <revision>`, so editing
          # Firmware/west.yml (a developer-side manifest) must not throw the
          # 1.5 GB workspace cache away.
          key: ncs-ws-${{ env.NCS_REVISION }}

      - name: Build firmware (lifegps/nrf54l15/cpuapp)
        run: |
          set -eux
          export ZEPHYR_BASE="${NCS_WORKSPACE}/zephyr"
          # BOARD_ROOT must be on the command line: sysbuild configures the image
          # before the application CMakeLists.txt is evaluated.
          west build -p always -b lifegps/nrf54l15/cpuapp \
            -d "${NCS_WORKSPACE}/build-fw" "${GITHUB_WORKSPACE}/Firmware" \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/Firmware" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Size gate (RRAM slot0 712 KB / SRAM 256 KB, see Firmware/docs/PARTITIONS.md)
        run: |
          set -eux
          SIZE_TOOL=arm-zephyr-eabi-size
          ${SIZE_TOOL} "${NCS_WORKSPACE}/build-fw/Firmware/zephyr/zephyr.elf"
          python3 - "${NCS_WORKSPACE}/build-fw/Firmware/zephyr/zephyr.elf" <<'PY'
          import subprocess
          import sys

          elf = sys.argv[1]
          out = subprocess.run(["arm-zephyr-eabi-size", elf], capture_output=True, text=True,
                               check=True).stdout.splitlines()
          header, values = out[0].split(), out[1].split()
          # columns are: text, data, bss, dec, hex, filename (hex/dec are not ints in base 10)
          text, init_data, bss = (int(v) for v in values[:3])
          flash_used = text + init_data
          ram_used = init_data + bss
          flash_limit = 712 * 1024
          ram_limit = 256 * 1024
          print(f"flash={flash_used} B / {flash_limit} B, ram={ram_used} B / {ram_limit} B")
          if flash_used > flash_limit:
              sys.exit("flash budget exceeded")
          if ram_used > ram_limit:
              sys.exit("ram budget exceeded")
          PY

      - name: Unit tests (twister, native_sim)
        run: |
          set -eux
          export ZEPHYR_BASE="${NCS_WORKSPACE}/zephyr"
          # The toolchain image ships cmake/ninja but not GNU make, which the Zephyr
          # CMakeLists.txt looks up unconditionally for its external-project targets.
          if ! command -v make >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends make
          fi
          # No pipe here: `make --version | head -1` died with SIGPIPE (141) under
          # `set -e -o pipefail` and failed the step.
          make --version > /dev/null 2>&1 && echo "make: available"
          cd "${GITHUB_WORKSPACE}"
          "${ZEPHYR_BASE}/scripts/twister" -p native_sim -T Firmware/tests \
            -O "${NCS_WORKSPACE}/twister-out" --inline-logs -v

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifegps-firmware-m1
          path: |
            /opt/ncs-workspace/build-fw/Firmware/zephyr/zephyr.hex
            /opt/ncs-workspace/build-fw/Firmware/zephyr/zephyr.elf
            /opt/ncs-workspace/build-fw/Firmware/zephyr/zephyr.map
          if-no-files-found: error
