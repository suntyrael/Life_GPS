# Life_GPS BLE 协议 SSOT（v0.1 草案）
#
# 规则：
# - 只改本文件，C/Kotlin/Markdown 生成物由 tools/protocol-gen 产出。
# - 字段只追加；破坏性变更升主版本。
# - 所有多字节字段小端。
# - 修改后运行：python3 tools/protocol-gen/validate.py

meta:
  name: "LIFE GPS BLE Protocol"
  version: "1.0.0"
  status: "draft"
  endianness: "little"
  mtu: 247
  max_command_payload: 235
  max_data_payload: 228

crc:
  record:
    algorithm: "crc8"
    poly: 0x07
    init: 0x00
    refin: false
    refout: false
    xorout: 0x00
  frame:
    algorithm: "crc16-ccitt-false"
    poly: 0x1021
    init: 0xFFFF
    refin: false
    refout: false
    xorout: 0x0000
  package:
    algorithm: "crc32-iso-hdlc"
    poly: 0x04C11DB7
    init: 0xFFFFFFFF
    refin: true
    refout: true
    xorout: 0xFFFFFFFF

uuids:
  service: "4C475053-0001-4C47-5053-000000000001"
  status: "4C475053-0002-4C47-5053-000000000001"
  control: "4C475053-0003-4C47-5053-000000000001"
  data: "4C475053-0004-4C47-5053-000000000001"
  telemetry: "4C475053-0005-4C47-5053-000000000001"
  log: "4C475053-0006-4C47-5053-000000000001"
  config: "4C475053-0007-4C47-5053-000000000001"
  smp_service: "8D53DC1D-1DB7-4CD3-868B-8A527460AA84"
  smp_characteristic: "DA2E7828-FBCE-4E01-AE9E-261174997C48"

frames:
  command:
    magic: 0xA5
    header_size: 8
    trailer_size: 2
    fields:
      - {name: magic, type: u8, offset: 0}
      - {name: ver, type: u8, offset: 1}
      - {name: opcode, type: u8, offset: 2}
      - {name: flags, type: u8, offset: 3}
      - {name: seq, type: u16, offset: 4}
      - {name: payload_len, type: u16, offset: 6}
  data:
    magic: 0x5A
    header_size: 14
    trailer_size: 2
    fields:
      - {name: magic, type: u8, offset: 0}
      - {name: ver, type: u8, offset: 1}
      - {name: stream, type: u8, offset: 2}
      - {name: flags, type: u8, offset: 3}
      - {name: transfer_id, type: u32, offset: 4}
      - {name: cursor, type: u32, offset: 8}
      - {name: payload_len, type: u16, offset: 12}

records:
  trajectory:
    size: 32
    crc: record
    fields:
      - {name: seq_id, type: u32, offset: 0}
      - {name: timestamp, type: u32, offset: 4}
      - {name: subsecond_ms, type: u16, offset: 8}
      - {name: latitude, type: i32, offset: 10}
      - {name: longitude, type: i32, offset: 14}
      - {name: altitude, type: i16, offset: 18}
      - {name: speed_cms, type: u16, offset: 20}
      - {name: heading, type: u16, offset: 22}
      - {name: step_count, type: u16, offset: 24}
      - {name: hdop, type: u8, offset: 26}
      - {name: satellites, type: u8, offset: 27}
      - {name: status_flags, type: u8, offset: 28}
      - {name: battery_level, type: u8, offset: 29}
      - {name: floor_level, type: i8, offset: 30}
      - {name: checksum, type: u8, offset: 31}
  raw:
    size: 0
    fields: []

packages:
  day:
    magic_ascii: "LGD1"
    header_ver: 1
    header_size: 48
    header_crc16_len: 46
    footer_size: 8
    codec: "byte_delta_heatshrink"
    crc32_scope: "uncompressed_trajectory"
    codec_values:
      raw: 0
      byte_delta_heatshrink: 1
    heatshrink:
      window_sz2: 8
      lookahead_sz2: 4
    header_fields:
      - {name: magic, type: u32, offset: 0}
      - {name: header_ver, type: u16, offset: 4}
      - {name: codec, type: u16, offset: 6}
      - {name: day_id, type: u32, offset: 8}
      - {name: record_count, type: u32, offset: 12}
      # Reserved slots keep the 48-byte header stable; all must be zero.
      - {name: reserved0, type: u32, offset: 16}
      - {name: traj_raw_len, type: u32, offset: 20}
      - {name: traj_packed_len, type: u32, offset: 24}
      - {name: reserved1, type: u32, offset: 28}
      - {name: reserved2, type: u32, offset: 32}
      - {name: prev_day_id, type: u32, offset: 36}
      - {name: reserved3, type: u32, offset: 40}
      - {name: flags, type: u16, offset: 44}
      - {name: header_crc16, type: u16, offset: 46}
    footer_fields:
      - {name: traj_crc32, type: u32, offset: 0}
      - {name: reserved, type: u32, offset: 4}

streams:
  - {id: 0, name: trajectory, record: trajectory}
  - {id: 2, name: archive_day, record: raw}
  - {id: 3, name: flash_raw, record: raw}
  - {id: 4, name: log_replay, record: raw}

commands:
  - {opcode: 0x01, name: GET_CAPS, direction: app_to_dev}
  - {opcode: 0x02, name: GET_STATUS, direction: app_to_dev}
  - {opcode: 0x10, name: SET_MODE, direction: app_to_dev}
  - {opcode: 0x11, name: SET_TIME, direction: app_to_dev}
  - {opcode: 0x12, name: POI_MARK, direction: app_to_dev}
  - {opcode: 0x13, name: SET_CONFIG, direction: app_to_dev}
  - {opcode: 0x14, name: GET_CONFIG, direction: app_to_dev}
  - {opcode: 0x20, name: SYNC_BEGIN, direction: app_to_dev}
  - {opcode: 0x21, name: SYNC_READ, direction: app_to_dev}
  - {opcode: 0x22, name: SYNC_END, direction: app_to_dev}
  - {opcode: 0x23, name: GET_DAY_INDEX, direction: app_to_dev}
  - {opcode: 0x24, name: GET_ARCHIVE, direction: app_to_dev}
  - {opcode: 0x30, name: LOG_SUBSCRIBE, direction: app_to_dev}
  - {opcode: 0x31, name: GNSS_SNAPSHOT, direction: app_to_dev}
  - {opcode: 0x32, name: IMU_SNAPSHOT, direction: app_to_dev}
  - {opcode: 0x33, name: BUTTON_EVENT, direction: dev_to_app}
  # 0x35 / 0x36 只在 0.2.0 追加。载荷字段表在 Doc/Software/BLE_Wire_v1.md §6.6 / §6.7。
  - {opcode: 0x35, name: GNSS_CFG, direction: app_to_dev}
  - {opcode: 0x36, name: GNSS_DEBUG, direction: app_to_dev}
  # 0x37 只在 0.5.0 追加：冷/温/热启动（固件发 UBX-CFG-RST）。载荷 `u8 mode`
  # （0 冷 / 1 温 / 2 热），字段表在 Doc/Software/BLE_Wire_v1.md §6.9。
  - {opcode: 0x37, name: GNSS_RESTART, direction: app_to_dev}
  - {opcode: 0x40, name: SELFTEST, direction: app_to_dev}
  - {opcode: 0x41, name: MAG_CAL, direction: app_to_dev}
  - {opcode: 0x42, name: BARO_BASELINE, direction: app_to_dev}
  # 0x43 只在 0.2.0 追加。校准类的请求/响应载荷不在本文件描述（YAML 目前没有
  # payloads schema），字段表在 Doc/Software/BLE_Wire_v1.md §6.3~§6.5，App 侧的
  # 唯一实现是 App/app/src/main/java/com/lifegps/app/ble/CalibCodec.kt。
  - {opcode: 0x43, name: ACCEL_CAL, direction: app_to_dev}
  - {opcode: 0x50, name: ERASE_DAY, direction: app_to_dev}
  - {opcode: 0x51, name: FACTORY_RESET, direction: app_to_dev}
  - {opcode: 0x52, name: REBOOT, direction: app_to_dev}
  - {opcode: 0x60, name: FLASH_INFO, direction: app_to_dev}
  - {opcode: 0x61, name: FLASH_READ, direction: app_to_dev}
  - {opcode: 0x62, name: FLASH_ERASE, direction: app_to_dev}
  - {opcode: 0x70, name: GET_FAULT_LOG, direction: app_to_dev}
  - {opcode: 0x71, name: POWER_TEST_MARK, direction: app_to_dev}
  - {opcode: 0x7F, name: DEBUG_UNLOCK, direction: app_to_dev}

telemetry:
  - {id: 0x01, name: GNSS}
  - {id: 0x02, name: IMU}
  - {id: 0x03, name: MAG}
  - {id: 0x04, name: BARO}
  - {id: 0x05, name: PDR}
  - {id: 0x06, name: POWER}
  - {id: 0x07, name: SYSTEM}
  - {id: 0x08, name: NMEA}
  - {id: 0x09, name: SAT}

# 0x00..0x06 冻结与 BLE_Wire_v1.md §3.1 完全一致；0x07..0x0C 为同步/存储只追加扩展。
status_codes:
  - {code: 0x00, name: OK}
  - {code: 0x01, name: INVALID_ARGUMENT}
  - {code: 0x02, name: UNKNOWN_OPCODE}
  - {code: 0x03, name: NOT_SUPPORTED}
  - {code: 0x04, name: BUSY}
  - {code: 0x05, name: INTERNAL_ERROR}
  - {code: 0x06, name: UNAUTHORIZED}
  - {code: 0x07, name: OUT_OF_RANGE}
  - {code: 0x08, name: NOT_FOUND}
  - {code: 0x09, name: FLASH_ERROR}
  - {code: 0x0A, name: LOW_BATTERY}
  - {code: 0x0B, name: CRC_MISMATCH}
  - {code: 0x0C, name: SESSION_EXPIRED}

# GET_CAPS.caps 能力位图：bit0..bit11 冻结不变，bit12+ 为只追加扩展。
caps_bits:
  - {bit: 0, name: STATUS_NOTIFY}
  - {bit: 1, name: LOG_NOTIFY}
  - {bit: 2, name: POI}
  - {bit: 3, name: FLASH_INFO}
  - {bit: 4, name: REBOOT}
  - {bit: 5, name: DEBUG_UNLOCK}
  - {bit: 6, name: DATA_SYNC}
  - {bit: 7, name: MAG_CAL}
  - {bit: 8, name: ACCEL_CAL}
  - {bit: 9, name: BARO_BASELINE}
  - {bit: 10, name: GNSS_DEBUG}
  - {bit: 11, name: GNSS_CFG}
  - {bit: 12, name: CONFIG_TLV}
  - {bit: 13, name: GNSS_RESTART}
  - {bit: 14, name: OTA_SMP}

# Config 特征（0007）与 SET_CONFIG(0x13)/GET_CONFIG(0x14) 共用的紧凑 TLV Key 表。
config_tlv:
  - {key: 0x01, name: RECORD_MODE, type: u8}
  - {key: 0x02, name: GNSS_RATE_HZ, type: u8}
  - {key: 0x03, name: GNSS_COLD_TIMEOUT_S, type: u16}
  - {key: 0x04, name: ARCHIVE_HOUR_UTC, type: u8}
  - {key: 0x05, name: LED_ENABLE, type: u8}
  - {key: 0x06, name: AUTO_OFF_MIN, type: u16}
  - {key: 0x07, name: PDR_STEP_K_MM, type: u16}
  - {key: 0x08, name: MAG_ANOMALY_UT, type: u16}
  - {key: 0x09, name: TZ_OFFSET_MIN, type: i16}
  - {key: 0x0A, name: BLE_ADV_INTERVAL_MS, type: u16}
  - {key: 0x0B, name: LOG_LEVEL_DEFAULT, type: u8}

# Scan Response 内的 Manufacturer Data 载荷（Company ID 0xFFFF 后 10 B，小端）。
adv_manufacturer_data:
  company_id: 0xFFFF
  version: 1
  size: 10
  fields:
    - {name: adv_ver, type: u8, offset: 0}
    - {name: work_mode, type: u8, offset: 1}
    - {name: battery_pct, type: u8, offset: 2}
    - {name: storage_pct, type: u8, offset: 3}
    - {name: adv_flags, type: u16, offset: 4}
    - {name: last_seq_id, type: u32, offset: 6}

# Status 帧长度演进（前 116 B 与 BLE_Wire_v1.md §4 冻结一致；116..127 为后续同步扩展）。
status_extension:
  base_size: 82
  motion_size: 100
  accuracy_size: 116
  sync_size: 128
  sync_fields:
    - {name: archive_index_ver, type: u32, offset: 116}
    - {name: last_seq_id, type: u32, offset: 120}
    - {name: work_mode, type: u8, offset: 124}
    - {name: archive_days_count, type: u8, offset: 125}
    - {name: storage_used_permille, type: u16, offset: 126}

