# SPDX-License-Identifier: MIT
# Life_GPS bench / bring-up debug overlay.
#
# Apply on top of prj.conf via:
#   west build -b lifegps/nrf54l15/cpuapp Firmware -- -DEXTRA_CONF_FILE=conf/debug.conf
#
# Preserves full M1 bench diagnostics (immediate INF console logging, 1 Hz
# five-line UART telemetry, BLE Log characteristic forwarding, continuous 10 Hz
# 460800-baud GNSS tracking) without altering the default production profile.

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LGPS_DIAG_TELEMETRY=y
CONFIG_LGPS_BLE_LOG=y
CONFIG_LGPS_GNSS_ALWAYS_ON=y
CONFIG_LGPS_GNSS_FAST_LINK=y
CONFIG_LGPS_GNSS_RATE_MS=100
CONFIG_LGPS_BOOT_HOLD_8S=n
CONFIG_LGPS_BLE_REQUIRE_ENCRYPT=n
