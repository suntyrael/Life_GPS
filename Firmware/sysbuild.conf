# Life_GPS sysbuild configuration (NCS v3.4.2 / nRF54L15-QFAA).
#
# MCUboot runs with both primary and secondary slots inside nRF54L15's 1524 KB
# internal RRAM (SWAP_USING_MOVE + embedded Ed25519 key, no KMU OTP provisioning
# required for personal bench flashing). Keeping both slots internal guarantees
# identical OTA behaviour on both 32 MB (W25Q256) and 64 MB (W25Q512) external
# SPI NOR boards.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
