# SPDX-License-Identifier: MIT
# Life_GPS firmware configuration (Main_V0.2 / nRF54L15-QFAA, NCS v3.4.2).
#
# Every option group below cites where the requirement comes from; nothing here
# is copied from another board or another Nordic series.

# --- console / diagnostics ---------------------------------------------------
# The only bring-up instrument is DEBUG_TX/RX (P0.00/P0.01, UARTE30, 115200 8N1),
# README section 9.2. Immediate mode keeps log order equal to event order, which
# matters when a fault happens right after a bus error.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# GNSS uses the interrupt-driven UART API (uart_irq_callback_user_data_set).
# Without this the nrfx UARTE driver leaves .irq_callback_set out of its API table
# and every irq_* call returns -ENOTSUP (134), which is what the M1 log showed.
CONFIG_UART_INTERRUPT_DRIVEN=y
# The GNSS link falls back to 9600 if the receiver answers nothing at 38400.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
# Production default uses deferred WRN-level logging so producers never stall on
# UARTE30 poll_out. conf/debug.conf restores immediate INF logging for bring-up.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_BACKEND_UART=y
# Default time format (hh:mm:ss.ms) is rendered from k_uptime, which is the
# millisecond timestamp the UART diagnostics need until UTC is known.
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y

# --- device drivers ----------------------------------------------------------
CONFIG_GPIO=y
# Hardware keys are verified OK on Main_V0.2; enable GPIOTE interrupts so keys.c
# runs event-driven with zero polling thread and prepares for INT1/SENSE wake.
CONFIG_GPIO_NRFX_INTERRUPT=y
# Needed by the key self-test to read back the effective pin configuration.
CONFIG_GPIO_GET_CONFIG=y
CONFIG_SPI=y
CONFIG_ADC=y
# Zephyr 4.4 renamed the watchdog subsystem symbol from WDT to WATCHDOG.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_HWINFO_NRF=y
CONFIG_REBOOT=y
# Long press on either key enters System OFF (README section 9.1).
CONFIG_POWEROFF=y

# External W25Q512NW NOR: SFDP is read at runtime because the JEDEC ID bytes are
# not printed in the archived datasheet (see the board devicetree comment).
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# --- kernel safety nets -----------------------------------------------------
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
# bt_le_adv_start() runs on the system workqueue now (advertising restart after a
# disconnect), and it opens HCI commands, so give it the same headroom as the
# other GATT call sites.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# Without thread names a Zephyr fatal error only prints "(unknown)" for the
# current thread, which is what made the first stack-overflow report hard to read.
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=0
# Float formatting is required: the diagnostic lines print g / dps / g^2 and
# latitude-longitude with 7 decimals, which is how a fix is verified on a scope-free setup.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# Cortex-M33 FPU: nav maths (ZUPT/PDR) runs on hardware float.
CONFIG_FPU=y

# --- Bluetooth LE (the phone is the only user interface) --------------------
# Wire format and GATT table: Doc/Software/BLE_Wire_v1.md. The device is a
# peripheral with a custom 128-bit service; no bonding in v1, so Status can be
# read on an unencrypted link (documented risk, not an oversight: there is
# nothing secret on a debug build and pairing without a screen means Just Works).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
# Name is set at runtime from FICR DEVICEID (LGPS-XXXX), so the build needs a
# dynamic buffer; 16 bytes covers "LGPS-FFFF" and saves the 248-byte default.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
# ATT MTU 247 needs an L2CAP TX MTU of 247 and ACL buffers of MTU + 4 (L2CAP
# header). Six TX buffers: one Status notification per second plus one command
# response must never starve the link-layer queue. The *incoming* pool is not a
# Kconfig knob in Zephyr 4.4 (BT_BUF_ACL_RX_COUNT was replaced by
# BT_BUF_ACL_RX_COUNT_EXTRA and derives from BT_MAX_CONN + 1), and two RX
# buffers are enough: a 251-byte one carries the whole 100-byte status frame.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=6
# 2M PHY and data length extension are what keep a 1 Hz status frame and the
# log stream cheap in airtime (Android_App_Plan.md decision D9/F8). The
# role-specific auto option replaces the deprecated BT_AUTO_PHY_UPDATE; the
# firmware no longer requests the PHY itself (two requests in the same window
# made the controller answer HCI 0x3A Controller Busy).
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
# The Zephyr default supervision timeout is 42 (in 10 ms units, i.e. 420 ms),
# which is legal but far too tight for a hand-held debug target: a few hundred
# milliseconds of hand-over-antenna loss tears the link down with HCI 0x08
# (connection timeout) while the firmware keeps running. 800 = 8 s.
# BT_GAP_AUTO_UPDATE_CONN_PARAMS (default y) sends these five seconds after
# connecting, and the central negotiates the final values.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y

# --- Production power & diagnostic profile -----------------------------------
# Default build enables the GNSS power-saving policy (38400 / 1 Hz, auto cut)
# and disables bring-up UART telemetry and BLE log forwarding.
# Pass -DEXTRA_CONF_FILE=conf/debug.conf for full bench bring-up diagnostics.
CONFIG_LGPS_DIAG_TELEMETRY=n
CONFIG_LGPS_BLE_LOG=n
CONFIG_LGPS_GNSS_ALWAYS_ON=n
CONFIG_LGPS_GNSS_FAST_LINK=n
