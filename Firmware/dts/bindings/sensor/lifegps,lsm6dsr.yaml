#
# STMicroelectronics LSM6DSRTR 6-axis IMU on the SPIM22 bus (Main_V0.2 U12).
#
# The part is used through its main SPI interface (LGA-14L pins 13/14 = SCL/SDA).
# Its auxiliary I2C master (pins 2/3 = SCx/SDx) is the only electrical path to
# LIS2MDL (U3) and BMP388 (U4) - those pins do not reach the MCU, they are tied
# to the local AUX_SCL/AUX_SDA nets with R14/R15 pull-ups to 1.9 V
# (Hardware/Schematic/Netlist_Main_V0.2_2026-11-11.tel).
#
# Register facts used by the driver come from ST datasheet DS11976 Rev 2.

description: STMicroelectronics LSM6DSR 6-axis IMU (SPI main interface)

compatible: "lifegps,lsm6dsr"

include: [spi-device.yaml]
